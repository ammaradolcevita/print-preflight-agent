[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "print-preflight-agent"
version = "0.2.0"
description = "Check and fix print artwork before checkout - usable from chat (MCP). Unofficial prototype."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "pymupdf-fonts>=1.0",
    "pillow>=10",
    "pyyaml>=6",
    "rapidfuzz>=3",
    "pyspellchecker>=0.8",
]

[project.optional-dependencies]
mcp = ["mcp>=2"]
web = ["streamlit>=1.35"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["preflight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"mcp_server/*" = ["E402"]
"web/*" = ["E402"]
"eval/*" = ["E402"]
