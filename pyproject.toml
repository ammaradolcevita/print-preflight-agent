[project]
name = "print-preflight-agent"
version = "0.1.0"
description = "Check and fix print artwork before checkout - usable from chat (MCP). Unofficial prototype."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "pillow>=10",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["preflight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
